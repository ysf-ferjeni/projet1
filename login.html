<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — DriveEasy</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark py-3">
    <div class="container">
      <a class="navbar-brand text-warning" href="index.html">Drive<span class="text-white">Easy</span></a>
      <a href="index.html" class="btn btn-outline-light btn-sm">  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-house-door-fill" viewBox="0 0 16 16">
  <path d="M6.5 14.5v-3.505c0-.245.25-.495.5-.495h2c.25 0 .5.25.5.5v3.5a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5"/>
</svg> Accueil</a>
    </div>
  </nav>

  <div class="card-log">
    <div class="text-center mb-4">
      <h2 class="fw-bold">Espace Client</h2>
      <p class="text-muted">Connectez-vous ou créez votre compte DriveEasy</p>
    </div>

    <ul class="nav nav-pills mb-4 nav-justified" id="pills-tab">
      <li class="nav-item">
        <button class="nav-link active fw-bold" data-bs-toggle="pill" data-bs-target="#login">Connexion</button>
      </li>
      <li class="nav-item">
        <button class="nav-link fw-bold" data-bs-toggle="pill" data-bs-target="#register">Inscription</button>
      </li>
    </ul>

    <div class="tab-content bg-white p-4 shadow-sm rounded border-0">
      <div class="tab-pane fade show active" id="login">
        <div class="mb-3">
          <label class="form-label small fw-bold">Adresse Email</label>
          <input id="lEmail" type="email" class="form-control" placeholder="votre@email.com" required>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-bold">Mot de passe</label>
          <input id="lPwd" type="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button class="btn btn-warning w-100 fw-bold py-2 mt-2" onclick="login()">Se connecter</button>
      </div>

      <div class="tab-pane fade" id="register">
        <div class="mb-3">
          <label class="form-label small fw-bold">Nom complet (lettres uniquement)</label>
          <input id="rNom" type="text" class="form-control" placeholder="Votre nom complet" required>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-bold">Adresse Email</label>
          <input id="rEmail" type="email" class="form-control" placeholder="votre@email.com" required>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-bold">Mot de passe</label>
          <input id="rPwd" type="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button class="btn btn-dark w-100 fw-bold py-2 mt-2" onclick="register()">Créer un compte</button>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
