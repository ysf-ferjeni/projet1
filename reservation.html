<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réservation — DriveEasy</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
    <div class="container">
      <a class="navbar-brand text-warning" href="index.html">Drive<span class="text-white">Easy</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navRes">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navRes">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item"><a class="nav-link text-white" href="index.html">Accueil</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="voitures.html">Véhicules</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="contact.html">Contact</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="admin.html">Admin</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2 mt-3 mt-lg-0">
          <div id="authLink" class="text-white">
            <a href="login.html" class="btn btn-outline-light btn-sm">Connexion</a>
          </div>
          <a href="voitures.html" class="btn btn-warning btn-sm fw-bold">Catalogue</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="contnr-reserv">
    <div class="phrase">
       <h2 style="color:black; font-weight:bold;">Réserver votre véhicule</h2>
          <p style="color:black; font-weight:normal;">Remplissez le formulaire ci-dessous pour effectuer votre réservation rapidement.</p>
          
    </div>
         
<hr class="mb-4" style="border-top: 1px solid #ccc;">
          <form id="resForm" class="row g-3">
            <div class="col-md-12">
              <label class="form-label fw-bold">Sélectionnez le véhicule</label>
              <select id="voiture" class="form-select" required></select>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-bold">Nom et prénom</label>
              <input type="text" id="nom" class="form-control" placeholder="Lettres uniquement" required>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-bold">Adresse Email</label>
              <input type="email" id="email" class="form-control" placeholder="exemple@email.com" required>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-bold">Numéro de téléphone</label>
              <div class="input-group">
                <span class="input-group-text fw-bold bg-light">+216</span>
                <input type="tel" id="tel" class="form-control" placeholder="8 chiffres (ex: 27559834)" maxlength="8" pattern="[0-9]{8}" required>
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-bold">Lieu de prise en charge</label>
              <select id="lieu" class="form-select">
                <option>Béja - Agence centrale</option>
                <option>Tunis - Aéroport Tunis-Carthage</option>
                <option>Tunis - Centre ville</option>
                <option>Sousse</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-bold">Date de début</label>
              <input type="date" id="dateDebut" class="form-control" required>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-bold">Date de fin</label>
              <input type="date" id="dateFin" class="form-control" required>
            </div>

            <div class="col-12">
              <div style="background-color: rgb(131, 230, 131);
              border: 1px solid gray;
              border-radius: 8px;
              padding: 15px;
              text-align: left;
              font-weight: bold;" id="total">   labe Total estimé : </div>
            </div>

            <div class="col-12 mt-4">
              <button class="btn btn-warning btn-lg w-100 fw-bold py-3" type="submit">Confirmer la réservation</button>
            </div>
          </form>
        
      
    
  </div>

  <footer class="bg-dark text-white pt-4 pb-3 mt-5">
    <div class="container text-center small opacity-75">
      © 2026 DriveEasy — Location de voiture en Tunisie.
    </div>
  </footer>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
