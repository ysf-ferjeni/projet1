<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration — DriveEasy</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark py-3">
    <div class="container">
      <a class="navbar-brand text-warning" href="index.html">Drive<span class="text-white">Easy</span></a>
      <a href="index.html" class="btn btn-outline-light btn-sm">Retour au site</a>
    </div>
  </nav>

  <div class="container py-5">
    <div id="adminLogin" style="max-width:420px;margin:auto">
      <div class="card shadow-sm border-0 p-4 bg-white rounded">
        <h3 class="text-center fw-bold mb-3"><i class="bi bi-shield-lock-fill text-warning"></i> Espace Admin</h3>
        <p class="text-muted text-center small mb-4">Connectez-vous pour gérer les réservations et messages.</p>
        <div class="mb-3">
          <label class="form-label small fw-bold">Identifiant</label>
          <input id="aUser" class="form-control" placeholder="admin">
        </div>
        <div class="mb-3">
          <label class="form-label small fw-bold">Mot de passe</label>
          <input id="aPwd" type="password" class="form-control" placeholder="••••••••">
        </div>
        <button class="btn btn-dark w-100 fw-bold py-2" onclick="checkAdmin()">Connexion Administrateur</button>
      </div>
    </div>

    <div id="adminDash" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h2 class="fw-bold mb-0">Tableau de bord DriveEasy</h2>
        <button class="btn btn-outline-danger btn-sm" onclick="adminLogout()"><i class="bi bi-box-arrow-right"></i> Déconnexion Admin</button>
      </div>

      <ul class="nav nav-pills mb-3">
        <li class="nav-item"><button class="nav-link active fw-bold" data-bs-toggle="tab" data-bs-target="#tabRes">Réservations</button></li>
        <li class="nav-item"><button class="nav-link fw-bold" data-bs-toggle="tab" data-bs-target="#tabMsg">Messages de contact</button></li>
        <li class="nav-item"><button class="nav-link fw-bold" data-bs-toggle="tab" data-bs-target="#tabUsers">Clients inscrits</button></li>
      </ul>

      <div class="tab-content bg-white p-4 shadow-sm rounded border-0">
        <div class="tab-pane fade show active" id="tabRes">
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-dark">
                <tr><th>Client</th><th>Téléphone</th><th>Véhicule</th><th>Période</th><th>Lieu</th><th>Total</th><th>Action</th></tr>
              </thead>
              <tbody id="tbRes"></tbody>
            </table>
          </div>
        </div>

        <div class="tab-pane fade" id="tabMsg">
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-dark">
                <tr><th>Date</th><th>Nom</th><th>Email</th><th>Message</th><th>Action</th></tr>
              </thead>
              <tbody id="tbMsg"></tbody>
            </table>
          </div>
        </div>

        <div class="tab-pane fade" id="tabUsers">
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-dark">
                <tr><th>Nom</th><th>Email</th><th>Action</th></tr>
              </thead>
              <tbody id="tbUsers"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
